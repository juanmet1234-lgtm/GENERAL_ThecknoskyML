<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica de RL</title>

    <!-- Opcional: Bootstrap para estilos bonitos -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>Práctica: Agente de Aprendizaje por Refuerzo</h2>

    <form method="post" class="mt-3 mb-4">

        <label class="form-label">Episodios:</label>
        <input type="number" name="episodes" value="200" class="form-control">

        <label class="form-label mt-3">Tasa de aprendizaje (alpha):</label>
        <input type="number" name="alpha" value="0.1" min="0" max="1" step="0.01" class="form-control">

        <label class="form-label mt-3">Descuento (gamma):</label>
        <input type="number" name="gamma" value="0.9" min="0" max="1" step="0.01" class="form-control">

        <label class="form-label mt-3">Exploración (epsilon):</label>
        <input type="number" name="epsilon" value="0.2" min="0" max="1" step="0.01" class="form-control">

        <button type="submit" class="btn btn-primary mt-4">Entrenar agente</button>
    </form>

    <hr>

    {% if rewards_plot %}
    <h3>Resultados del entrenamiento</h3>
    <img src="data:image/png;base64,{{ rewards_plot }}" style="width: 600px;">
    {% endif %}

</div>

</body>
</html>
